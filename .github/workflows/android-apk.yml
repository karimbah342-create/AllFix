name: Bygg Android APK

# Bygger allfix.apk på GitHubs servrar och lägger den under Releases.
# Körs vid varje push till main, eller manuellt under fliken Actions.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle-cache
        uses: gradle/actions/setup-gradle@v4

      - name: Installera paket
        run: npm ci

      - name: Bygg appens gränssnitt (web/alltfix.html)
        run: npm run build:web

      - name: Skapa Android-projektet (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Bygg APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Döp om filen
        run: cp android/app/build/outputs/apk/release/app-release.apk allfix.apk

      - name: Spara som byggartefakt
        uses: actions/upload-artifact@v4
        with:
          name: allfix-apk
          path: allfix.apk

      - name: Publicera under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build${{ github.run_number }}"
          git log -1 --pretty=%B | grep -viE '^(co-authored-by|claude-session)' > notes.md || true
          printf '\nLadda ner allfix.apk på Android-mobilen och installera ovanpå den gamla versionen.\n' >> notes.md
          gh release create "$TAG" allfix.apk \
            --title "AlltFix ${VERSION} (bygge ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
