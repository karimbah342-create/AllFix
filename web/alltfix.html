<title>AlltFix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>/*@LEAFLET_CSS@*/</style>
<style>
/* Layout: one phone-sized app column. Every screen has the same white top bar and white bottom tab bar. */
:root{
  --forest:#0f2a26;      /* brand dark, used by logo text and accents */
  --green:#0e8f6a;       /* primary */
  --green-soft:#e3f4ed;
  --bg:#f3f6f4;
  --card:#ffffff;
  --ink:#14211e;
  --muted:#5f716c;
  --line:#e2e9e6;
  --star:#f2a516;
  --danger:#c0313f;
  --warn-bg:#fff3d6; --warn:#9a6300;
  --visa:#1a1f71;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--forest);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,select{font:inherit;color:var(--ink)}
a{color:var(--green)}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px 16px;
  background:radial-gradient(1200px 600px at 20% 0%,#1d4a42 0%,transparent 60%),var(--forest)}
.pitch{color:#e8f1ee;max-width:340px}
.pitch .logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:-.02em}
.pitch .logo svg{width:52px;height:52px}
.pitch p.tag{font-size:20px;margin:6px 0 28px;color:#b9d2cb}
.pitch h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3;text-wrap:balance;margin:0 0 22px}
.pitch small{display:block;margin-top:28px;color:#87a59d;font-size:13px}
.phone{width:390px;height:min(820px,calc(100vh - 48px));min-height:640px;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;
  box-shadow:0 0 0 10px #0a1714,0 0 0 11px #2a4741,0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column}
@media (max-width:860px){body{background:var(--card)}.pitch{display:none}.stage{padding:0;background:var(--card);height:100%;min-height:0;display:block}.phone{width:100%;height:100%;min-height:0;border-radius:0;box-shadow:none}}
.statusbar{height:34px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 4px;font-size:13px;font-weight:700;flex:none;background:var(--card);color:var(--ink)}
@media (max-width:860px){.statusbar{display:none}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.view::-webkit-scrollbar{display:none}
.view.fill{overflow:hidden;display:flex;flex-direction:column}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bars: identical white bar on every screen */
.top{background:var(--card);display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:4px;padding:6px 10px;min-height:54px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex:none}
.top h1{margin:0;font-family:var(--display);font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.top .ib:hover{background:var(--bg)}
.top .ib.on svg{fill:#e0425b;stroke:#e0425b}
.apphead{background:var(--card);padding:12px 18px 16px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--forest)}
.brand svg{width:28px;height:28px}
.langpill{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;letter-spacing:.04em}
.loc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:8px 0 12px}
.loc .ico{width:15px;height:15px;color:var(--green)}
.search{display:flex;align-items:center;gap:10px;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:15px;min-width:0}
.search .ico{width:19px;height:19px}
.pad{padding:16px 18px}

/* home */
.hero{position:relative;border-radius:20px;overflow:hidden;color:#fff;padding:20px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;width:100%;text-align:left;
  background:linear-gradient(105deg,rgba(15,42,38,.92) 30%,rgba(15,42,38,.2)),radial-gradient(circle at 85% 30%,#d7b98e 0 18%,transparent 19%),linear-gradient(160deg,#a58a67,#5b4a39)}
.hero .sofa{position:absolute;right:-6px;top:18px;width:170px;opacity:.9}
.hero h3{font-family:var(--display);font-size:20px;margin:0;position:relative}
.hero p{margin:4px 0 0;font-size:13px;color:#d4e3df;position:relative}
.hero .go{position:absolute;right:16px;bottom:16px;width:36px;height:36px;border-radius:50%;background:#2bb98a;display:grid;place-items:center}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-top:18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:12px;font-weight:600;line-height:1.2;min-width:0}
.cat .tile{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);transition:transform .15s}
.cat:hover .tile{transform:translateY(-2px)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.sec-h h4{margin:0;font-family:var(--display);font-size:16px}
.sec-h button{color:var(--green);font-weight:700;font-size:13px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
.hscroll::-webkit-scrollbar{display:none}
.pop{flex:none;width:150px;background:var(--card);border-radius:16px;overflow:hidden;text-align:left;border:1px solid var(--line)}
.pop .ph{height:78px;display:grid;place-items:center;color:#fff}
.pop .ph .ico{width:30px;height:30px}
.pop div.t{padding:9px 11px 11px;font-size:13px}
.pop b{display:block}
.pop span{color:var(--muted);font-size:12px}

/* category page: each category has its own background */
.catpage{min-height:100%;background:var(--tint)}
.cbanner{position:relative;overflow:hidden;color:#fff;padding:22px 18px 20px;background:
  radial-gradient(circle at 12% 120%,rgba(255,255,255,.18) 0 34%,transparent 35%),
  radial-gradient(circle at 105% -10%,rgba(255,255,255,.14) 0 30%,transparent 31%),
  linear-gradient(135deg,var(--c),var(--c2))}
.cbanner .big{position:absolute;right:-14px;bottom:-22px;width:150px;height:150px;opacity:.18;stroke-width:1.3}
.cbanner h2{margin:0;font-family:var(--display);font-size:22px;position:relative}
.cbanner p{margin:6px 0 0;font-size:13.5px;opacity:.9;max-width:28ch;position:relative;line-height:1.4}
.cbanner .count{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;position:relative}
.catpage .chips{background:transparent;border:0;padding-bottom:4px}
.catpage .chip{background:rgba(255,255,255,.75)}
.catpage .chip.on{background:var(--c);border-color:var(--c)}

.list{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:18px;padding:6px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:11px 10px;border-radius:12px;text-align:left;width:100%;min-width:0}
.row:hover{background:var(--bg)}
.row .tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.row .txt{flex:1;min-width:0}
.row b{display:block;font-size:15px}
.row span.sub{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:#9aaba6;width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip .dotc{width:9px;height:9px;border-radius:50%}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.sortbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.prov{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;text-align:left;width:100%}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:17px}
.prov .info{flex:1;min-width:0}
.prov h5{margin:0;font-size:15.5px;display:flex;gap:6px;align-items:center}
.verif{width:16px;height:16px;color:var(--green)}
.meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.meta .ico{width:14px;height:14px}
.stars{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--ink)}
.stars svg{width:14px;height:14px;fill:var(--star);stroke:none}
.avail{color:var(--green);font-weight:600}
.prov .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{background:var(--green);color:#fff;font-weight:700;border-radius:12px;padding:9px 18px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#0b7b5b}
.btn .ico{width:18px;height:18px}
.btn.block{width:100%;padding:14px;font-size:15.5px;border-radius:14px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:var(--card);color:var(--danger);border:1px solid #f0c9cd}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* detail */
.dhero{height:170px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.92)}
.dhero .ico{width:76px;height:76px;stroke-width:1.2}
.dcard{background:var(--card);border-radius:24px 24px 0 0;margin-top:-22px;position:relative;padding:20px 18px 24px}
.dcard h2{font-family:var(--display);font-size:21px;margin:0;display:flex;align-items:center;gap:8px}
.dcard .from{font-family:var(--display);font-size:22px;font-weight:700;margin:14px 0 6px}
.dcard p.desc{color:#3d4d49;line-height:1.55;margin:8px 0 14px}
.badges{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.badges span{display:flex;gap:5px;align-items:center}
.badges .ico{width:15px;height:15px;color:var(--green)}
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.svc .price{font-size:14px}
.review{background:var(--bg);border-radius:14px;padding:12px;font-size:13.5px;line-height:1.5;margin-top:10px}
.review b{display:flex;justify-content:space-between}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--muted);font-size:12.5px;margin-top:10px;text-align:center}
.note .ico{width:14px;height:14px}

/* booking */
.sumcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:6px}
.sumcard .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #b8c6c2;flex:none}
.on > .radio,.radio.on{border:6px solid var(--green)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:9px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted)}
.day b{display:block;font-size:17px;color:var(--ink);font-family:var(--display)}
.day.on{background:var(--green);border-color:var(--green);color:#d9f2e8}
.day.on b{color:#fff}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.time.on{background:var(--green);color:#fff;border-color:var(--green)}
.time[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:50px}
.field input{border:0;outline:0;flex:1;background:transparent;min-width:0;font-variant-numeric:tabular-nums}
.field .ico{width:18px;height:18px;color:var(--muted)}
.field.bad{border-color:var(--danger)}
.pay{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;text-align:left}
.pay.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.pay .txt{flex:1;min-width:0}
.pay small{display:block;color:var(--muted);font-size:12px}
.visa{width:46px;height:30px;border-radius:6px;background:var(--visa);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-style:italic;font-size:12px;letter-spacing:.04em;flex:none}
.addcard{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px dashed #b8c6c2;border-radius:14px;padding:14px;margin-bottom:8px}
.addcard .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addcard .hint{font-size:12px;color:var(--muted);line-height:1.4}
.err{font-size:12.5px;color:var(--danger);font-weight:600}
.linkbtn{color:var(--green);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.linkbtn .ico{width:18px;height:18px}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:14px;font-size:13.5px;line-height:1.45;text-align:left;width:100%}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid #b8c6c2;flex:none;display:grid;place-items:center;color:#fff}
.check .box .ico{width:15px;height:15px;stroke-width:3}
.check.on .box{background:var(--green);border-color:var(--green)}
.check u{color:var(--green);font-weight:700;text-decoration:none}
.totals{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:18px;font-size:14px}
.totals div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-variant-numeric:tabular-nums}
.totals .sum{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:16px}
.stickybot{position:sticky;bottom:0;background:linear-gradient(rgba(243,246,244,0),var(--bg) 22%);padding:22px 18px 18px}

/* confirm */
.done{text-align:center;padding:40px 24px 20px}
.done .ring{width:88px;height:88px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;margin:0 auto 18px;color:var(--green);animation:pop .5s ease}
.done .ring .ico{width:44px;height:44px;stroke-width:2.4}
.done h2{font-family:var(--display);margin:0 0 6px}
.done p{color:var(--muted);margin:0 auto;max-width:280px;line-height:1.5}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* bookings */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:9px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.bk{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;align-items:flex-start;width:100%;text-align:left}
.bk .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.bk .txt{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.bk .txt b{display:block;color:var(--ink);font-size:15px}
.bk .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:#0b7458}
.pill.live{background:var(--warn-bg);color:var(--warn)}
.pill.past{background:var(--bg);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.5}

/* profile & settings */
.me{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.me h3{margin:0;font-family:var(--display);font-size:18px}
.prem{display:inline-flex;gap:4px;align-items:center;background:var(--green-soft);color:#0b7458;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:4px}
.prem .ico{width:12px;height:12px}
.menu .row .lead{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.menu .row .lead .ico{width:19px;height:19px}
.guar{display:flex;gap:12px;background:var(--green-soft);color:#174a3d;border-radius:18px;padding:16px;margin-top:14px;font-size:13px;line-height:1.5}
.guar .ico{width:34px;height:34px;color:var(--green)}
.guar b{display:block;font-size:15px;color:var(--forest);margin-bottom:2px}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 10px;min-height:56px}
.setrow + .setrow{border-top:1px solid var(--line)}
.setrow .txt{flex:1;min-width:0}
.setrow b{display:block;font-size:14.5px}
.setrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.setrow select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);max-width:170px}
.sw{width:48px;height:28px;border-radius:999px;background:#c9d4d1;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.segsm{display:inline-grid;grid-auto-flow:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.segsm button{padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.segsm button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.terms{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 18px 18px}
.terms h3{font-family:var(--display);font-size:15.5px;margin:18px 0 6px}
.terms p,.terms li{font-size:14px;line-height:1.6;color:#2c3b37;margin:0}
.terms ul{margin:0;padding-left:20px}
.demo-note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px;line-height:1.45}
.updbox{display:flex;flex-direction:column;gap:8px;margin:6px;padding:14px;border-radius:14px;background:var(--green-soft);color:#174a3d}
.updbox b{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--forest)}
.updbox b .ico{color:var(--green)}
.updbox small{font-size:12.5px;line-height:1.45;color:#3d5b52}
.updbox .news{background:rgba(255,255,255,.7);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.updbox .news span{font-weight:700;display:block;margin-bottom:4px}
.updbox .news ul{margin:0;padding-left:18px}
.updmsg{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.updmsg .ico{width:18px;height:18px}
.updmsg.ok{color:var(--green)} .updmsg.bad{color:var(--danger)}
.updbanner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--green-soft);border:1px solid #bfe3d4;border-radius:16px;padding:12px 14px;margin-bottom:14px;color:var(--forest)}
.updbanner > .ico:first-child{color:var(--green)}
.updbanner .txt{flex:1;min-width:0}
.updbanner b{display:block;font-size:14.5px}
.updbanner small{display:block;font-size:12.5px;color:#3d5b52}
.updbanner .chev{width:18px;height:18px;color:#5f8a7d}
.rcpt{display:flex;justify-content:space-between;gap:12px;padding:12px 10px;font-size:13px;color:var(--muted)}
.rcpt + .rcpt{border-top:1px solid var(--line)}
.rcpt b{display:block;color:var(--ink);font-size:14.5px}

/* map */
.mapbox{flex:1;position:relative;min-height:0;isolation:isolate;z-index:0}
.mapbox #map{position:absolute;inset:0;background:#e8eeec}
.mk{display:grid;place-items:center;width:36px;height:36px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.mk .ico{width:18px;height:18px;color:#fff;transform:rotate(45deg)}
.mk.sel{outline:3px solid rgba(14,143,106,.35);outline-offset:2px}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2f6fd6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,111,214,.25)}
.mapcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:1000;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px}
.mapcard .head{display:flex;gap:12px;align-items:center}
.mapcard .head .info{flex:1;min-width:0}
.mapcard h5{margin:0;font-size:15.5px;display:flex;gap:6px;align-items:center}
.mapcard .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.maphint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);box-shadow:0 3px 10px rgba(0,0,0,.12);white-space:nowrap}
.leaflet-container{font-family:var(--body)}
.mapnote{position:absolute;left:12px;right:12px;top:12px;z-index:1100;background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:8px}
.mapnote b{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:16px}
.mapnote b .ico{color:var(--green)}
.mapnote p{margin:0;font-size:14px;line-height:1.5;color:#2c3b37}
.mapnote .btn{margin-top:4px;align-self:flex-start}
.mapnote .btn.block{align-self:stretch}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;padding:16px 18px}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45}
.msg.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--green);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.compose{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.compose input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:0 16px;height:42px;outline:0;min-width:0}
.compose button{width:42px;height:42px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}

/* tab bar: white on every screen */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#8a9a96;position:relative;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{color:var(--green)}
.tab .dot{position:absolute;top:-2px;right:calc(50% - 20px);background:#e0425b;color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--forest);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:2000;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

function parseTag(tag){
  const m = String(tag || '').match(/^v?(\d+(?:\.\d+)*)(?:-build(\d+))?/);
  return m ? {version:m[1], build:+(m[2] || 0)} : null;
}
function isNewer(a, b){ // is a newer than b?
  const x = a.version.split('.').map(Number), y = b.version.split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++){ const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; }
  return a.build > b.build;
}
const verTxt = v => v.build ? `${v.version} (${v.build})` : v.version;
async function checkUpdate(silent){
  S.upd.state = 'checking'; if (!silent) render();
  try {
    const res = await fetch(`https://api.github.com/repos/${APP.repo}/releases/latest`, {headers:{Accept:'application/vnd.github+json'}, cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rel = await res.json(), v = parseTag(rel.tag_name);
    const asset = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
    if (!v || !asset) throw new Error('no apk');
    const notes = String(rel.body || '').split('\n').map(l => l.trim()).filter(l => l && !/^(co-authored-by|claude-session)/i.test(l) && !/installera|install/i.test(l)).slice(0, 8);
    S.upd.latest = {...v, url: asset.browser_download_url, date: rel.published_at, notes};
    S.upd.state = isNewer(v, APP) ? 'available' : 'none';
  } catch (e) { S.upd.state = silent ? 'idle' : 'error'; }
  S.upd.checked = Date.now(); store.set('updChecked', S.upd.checked);
  const cur = S.stack[S.stack.length - 1];
  if (!silent || ['settings','home'].includes(cur.s)) render();
}

  const day = diff === 0 ? t('today') : diff === 1 ? t('tomorrow') : d.toLocaleDateString(loc(), {day:'numeric', month:'short'}).replace('.','');
  return `${day}, ${b.time}`;
}

  const n = parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255, f=x=>Math.round(x+(255-x)*w);

}
function shade(hex, k){ const n = parseInt(hex.slice(1),16), f=x=>Math.round(x*k); return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`; }

const topPlain = title => `<header class="top"><span></span><h1>${esc(title)}</h1><span></span></header>`;
const tile = c => `<span class="tile" style="background:${c.c}">${ic(c.icon)}</span>`;
const starTxt = p => `<span class="stars">${ic('star')}${num1(p.r)}</span> (${p.n})`;
const visaRow = (c, on, act, id) => `<button class="pay ${on?'on':''}" ${act?`data-act="${act}" data-id="${id}"`:''}><span class="visa">VISA</span><span class="txt"><b>VISA •••• ${c.last4}</b><small>${t('expires',{e:c.exp})}</small></span>${act?'<span class="radio"></span>':''}</button>`;

function updBox(){
  const u = S.upd, L2 = u.latest;
  if (u.state === 'available') return `<div class="updbox">
      <b>${ic('download')}${t('s_updAvail',{v:verTxt(L2)})}</b>
      ${L2.date ? `<small>${t('s_updDate',{d:new Date(L2.date).toLocaleDateString(loc(),{day:'numeric',month:'long',year:'numeric'})})}</small>` : ''}
      ${L2.notes.length ? `<div class="news"><span>${t('s_updNews')}</span><ul>${L2.notes.map(n=>`<li>${esc(n.replace(/^[-*]\s*/,''))}</li>`).join('')}</ul></div>` : ''}
      <a class="btn block" href="${esc(L2.url)}" target="_blank" rel="noopener">${ic('download')}${t('s_updGet')}</a>
      <small>${t('s_updHow')}</small>
    </div>`;
  const msg = u.state === 'none' ? `<div class="updmsg ok">${ic('check')}${t('s_updNone')}</div>`
    : u.state === 'error' ? `<div class="updmsg bad">${ic('info')}${t('s_updErr')}</div>` : '';
  return `<div class="setrow" style="flex-direction:column;align-items:stretch;gap:8px">${msg}<button class="btn ghost block" data-act="updcheck" ${u.state==='checking'?'disabled':''}>${ic('refresh')}${u.state==='checking'?t('s_updChecking'):t('s_updCheck')}</button></div>`;
}
function cardForm(f){
  return `<div class="addcard">
    <label class="field ${f.err==='no'||f.err==='visa'?'bad':''}">${ic('card')}<input id="cno" inputmode="numeric" autocomplete="cc-number" placeholder="${t('cardNo')}" value="${esc(f.no||'')}" maxlength="19"></label>
    <div class="grid2">
      <label class="field ${f.err==='exp'?'bad':''}"><input id="cexp" inputmode="numeric" autocomplete="cc-exp" placeholder="${t('exp')}" value="${esc(f.exp||'')}" maxlength="5"></label>
      <label class="field ${f.err==='cvc'?'bad':''}"><input id="ccvc" inputmode="numeric" autocomplete="cc-csc" placeholder="${t('cvc')}" value="" maxlength="3"></label>
    </div>
    ${f.err ? `<div class="err">${t({visa:'errVisa',no:'errNo',exp:'errExp',cvc:'errCvc'}[f.err])}</div>` : ''}
    <div class="hint">${t('cardHint')}</div>
    <div class="two"><button class="btn ghost" data-act="cardcancel">${t('cancel')}</button><button class="btn" data-act="cardsave">${t('saveCard')}</button></div>
  </div>`;
}
function provCard(p){
  return `<button class="prov" data-act="prov" data-id="${p.id}">
    <span class="av" style="background:${avColor(p)}">${initials(p.name)}</span>
    <span class="info"><h5>${esc(p.name)}${ic('badge','verif')}</h5>
      <div class="meta">${starTxt(p)} · ${subName(p.sub)} · ${kmTxt(p)}</div>
      <div class="meta avail">${ic('clock')}${t('when_'+p.when)}</div>
      <div class="bottom"><span class="price">${t('from')} ${kr(p.from)}</span><span class="btn" data-act="book" data-id="${p.id}">${t('book')}</span></div>
    </span></button>`;
}
const luhn = s => { let sum = 0; [...s].reverse().forEach((ch,i)=>{ let d=+ch; if(i%2){ d*=2; if(d>9) d-=9; } sum+=d; }); return sum % 10 === 0; };
function validateCard(no, exp, cvc){
  const n = no.replace(/\D/g,'');
  if (!n.startsWith('4')) return 'visa';
  if (n.length !== 16 || !luhn(n)) return 'no';
  const m = exp.match(/^(\d{2})\/(\d{2})$/); if (!m) return 'exp';
  const mm = +m[1], yy = 2000 + +m[2], now = new Date();
  if (mm < 1 || mm > 12 || yy < now.getFullYear() || (yy === now.getFullYear() && mm < now.getMonth()+1)) return 'exp';
  if (!/^\d{3}$/.test(cvc)) return 'cvc';
  return null;
}

/* ---------- map ---------- */
let MAP = null, mapMarkers = {};
function destroyMap(){ if (MAP){ const m = MAP; MAP = null; mapMarkers = {}; try{ m.stop(); m.off(); m.remove(); }catch{} } }
function mountMap(){
  const el = document.getElementById('map'); if (!el) return;
  const ids = (el.dataset.list || '').split(',').filter(Boolean), list = ids.map(prov);
  if (typeof L === 'undefined'){ el.innerHTML = `<p class="empty">${t('mapOff')}</p>`; return; }
  const c = city();
  MAP = L.map(el, {zoomControl:true, attributionControl:true, tap:true}).setView([c.lat, c.lng], 12);
  const layers = [
    ['https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}],
  ];
  const useLayer = i => {
    const lyr = L.tileLayer(layers[i][0], layers[i][1]); let ok = 0, bad = 0;
    lyr.on('tileload', () => { ok++; if (S.mapErr){ S.mapErr = false; paintNotice(); } });
    lyr.on('tileerror', () => { bad++; if (ok === 0 && bad === 4){
      if (i + 1 < layers.length){ if (MAP){ MAP.removeLayer(lyr); useLayer(i + 1); } }
      else { S.mapErr = true; paintNotice(); } } });
    lyr.addTo(MAP);
  };
  useLayer(0);
  L.marker([c.lat, c.lng], {icon:L.divIcon({className:'', html:'<span class="me-dot"></span>', iconSize:[18,18], iconAnchor:[9,9]}), title:t('youAreHere'), keyboard:false}).addTo(MAP);
  list.forEach(p => {
    const ca = cat(p.cat);
    const m = L.marker([p.lat, p.lng], {title:p.name, icon:L.divIcon({className:'', html:`<span class="mk" data-mk="${p.id}" style="--c:${ca.c}">${ic(ca.icon)}</span>`, iconSize:[36,36], iconAnchor:[18,36]})}).addTo(MAP);
    m.on('click', () => selectOnMap(p.id));
    mapMarkers[p.id] = m;
  });
  MAP.on('click', () => selectOnMap(null));
  const focus = S.stack[S.stack.length-1].focus;
  if (focus && prov(focus)){ const p = prov(focus); MAP.setView([p.lat, p.lng], 15, {animate:false}); selectOnMap(focus); }
  else if (list.length){ const b = L.latLngBounds(list.map(p=>[p.lat,p.lng])); b.extend([c.lat,c.lng]); MAP.fitBounds(b, {padding:[36,36], maxZoom:14, animate:false}); }
  const mine = MAP; setTimeout(() => { if (MAP === mine && mine) mine.invalidateSize({animate:false}); }, 80);
}
function mapNotice(){
  if (S.mapInfo) return `<div class="mapnote" id="mapnote" role="dialog" aria-label="${t('mapInfoT')}"><b>${ic('info')}${t('mapInfoT')}</b><p>${t('mapInfo1')}</p><p>${t('mapInfo2')}</p><p>${t('mapInfo3')}</p><button class="btn block" data-act="mapinfook">${t('mapInfoOk')}</button></div>`;
  if (S.mapErr) return `<div class="mapnote" id="mapnote" role="alert"><b>${ic('info')}${t('mapErrT')}</b><p>${t('mapErr')}</p><button class="btn" data-act="mapretry">${t('retry')}</button></div>`;
  return '<div id="mapnote" hidden></div>';
}
function paintNotice(){ const n = document.getElementById('mapnote'); if (n) n.outerHTML = mapNotice(); }
function selectOnMap(id){
  const card = document.getElementById('mapcard'); if (!card) return;
  document.querySelectorAll('.mk.sel').forEach(x=>x.classList.remove('sel'));
  const hint = document.querySelector('.maphint'); if (hint) hint.hidden = !!id;
  if (!id){ card.hidden = true; return; }
  const p = prov(id), mk = document.querySelector(`[data-mk="${id}"]`); if (mk) mk.classList.add('sel');
  card.innerHTML = `<div class="head"><span class="av" style="background:${avColor(p)};width:44px;height:44px;font-size:15px">${initials(p.name)}</span>
      <div class="info"><h5>${esc(p.name)}${ic('badge','verif')}</h5><div class="meta">${starTxt(p)} · ${subName(p.sub)} · ${kmTxt(p)}</div><div class="meta"><span class="price" style="color:var(--ink)">${t('from')} ${kr(p.from)}</span></div></div>
      <button class="x" data-act="mapclose" aria-label="${t('cancel')}">${ic('x')}</button></div>
    <div class="two"><button class="btn" data-act="prov" data-id="${p.id}">${t('openProv')}</button><a class="btn ghost" href="${gmaps(p)}" target="_blank" rel="noopener">${ic('nav')}${t('googleMaps')}</a></div>`;
  card.hidden = false;
}

/* ---------- render ---------- */
function render(scrollTop){
  const cur = S.stack[S.stack.length-1];
  destroyMap();
  const isMap = cur.s === 'map' || (cur.s === 'list' && cur.mode === 'map');
  view.classList.toggle('fill', isMap);
  view.innerHTML = screens[cur.s](cur);
  document.documentElement.lang = lang;
  const showTabs = !['book','chat'].includes(cur.s);
  const tb = document.getElementById('tabbar');
  tb.hidden = !showTabs;
  const tabs = [['home','home'],['map','map'],['bookings','cal'],['favs','heart'],['profile','user']];
  const nAct = S.bookings.filter(b=>b.status!=='past').length;
  tb.innerHTML = tabs.map(([k,i])=>`<button class="tab ${S.tab===k?'on':''}" data-act="tabto" data-id="${k}">${ic(i)}<span>${t('tab_'+k)}</span>${k==='bookings'&&nAct?`<b class="dot">${nAct}</b>`:''}</button>`).join('');
  const old = document.getElementById('compose'); if (old) old.remove();
  if (cur.s === 'chat'){
    const f = document.createElement('form'); f.className = 'compose'; f.id = 'compose';
    f.innerHTML = `<input id="msgin" placeholder="${t('chatPh')}" autocomplete="off"><button aria-label="Send">${ic('send')}</button>`;
    view.after(f);
    f.addEventListener('submit', e => { e.preventDefault(); const inp = f.querySelector('input'); const v = inp.value.trim(); if (!v) return;
      const log = S.chats[cur.id]; log.push({me:true, t:v}); render();
      setTimeout(() => { log.push({me:false, t: cur.id==='support' ? t('supportReply') : t('provReply')}); if (S.stack[S.stack.length-1] === cur) render(); }, 900);
    });
    requestAnimationFrame(() => { view.scrollTop = view.scrollHeight; f.querySelector('input').focus(); });
  } else if (scrollTop) view.scrollTop = 0;
  if (isMap) requestAnimationFrame(mountMap);
  const q = document.getElementById('q');
  if (q) q.addEventListener('keydown', e => { if (e.key === 'Enter'){ S.q = q.value; go('cats'); } });
  const q2 = document.getElementById('q2');
  if (q2) q2.addEventListener('input', () => { S.q = q2.value; const pos = q2.selectionStart; render(); const n = document.getElementById('q2'); n.focus(); n.setSelectionRange(pos,pos); });
  const addr = document.getElementById('addr');
  if (addr) addr.addEventListener('input', () => S.draft.addr = addr.value);
  const cs = document.getElementById('citysel');
  if (cs) cs.addEventListener('change', () => { S.set.city = cs.value; save(); toast(t('saved')); });
  const cno = document.getElementById('cno');
  if (cno){
    cno.addEventListener('input', () => { const d = cno.value.replace(/\D/g,'').slice(0,16); cno.value = d.replace(/(\d{4})(?=\d)/g,'$1 '); S.cardForm.no = cno.value; });
    const ce = document.getElementById('cexp');
    ce.addEventListener('input', () => { let d = ce.value.replace(/\D/g,'').slice(0,4); if (d.length > 2) d = d.slice(0,2)+'/'+d.slice(2); ce.value = d; S.cardForm.exp = d; });
  }
  document.getElementById('pitchTag').textContent = t('pitchTag');
  document.getElementById('pitchH').textContent = t('pitchH');
  document.getElementById('pitchSmall').textContent = t('pitchSmall');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, cur = S.stack[S.stack.length-1];
  switch(a){
    case 'back': back(); break;
    case 'go': go(id); break;
    case 'cat': go('list', {id}); break;
    case 'allcats': S.q = ''; go('cats'); break;
    case 'sub': cur.sub = id; render(); break;
    case 'mode': cur.mode = cur.mode === 'map' ? 'list' : 'map'; render(true); break;
    case 'mapcat': S.mapCat = id; render(); break;
    case 'mapclose': selectOnMap(null); break;
    case 'mapinfo': S.mapInfo = true; paintNotice(); break;
    case 'mapinfook': S.mapInfo = false; store.set('mapInfoSeen', true); paintNotice(); break;
    case 'mapretry': S.mapErr = false; render(); break;
    case 'mapfocus': go('map', {focus:id}); break;
    case 'prov': e.stopPropagation(); go('prov', {id}); break;
    case 'fav': { const i = S.favs.indexOf(id); i<0 ? S.favs.push(id) : S.favs.splice(i,1); save(); render(); toast(i<0 ? t('favAdded') : t('favRemoved')); break; }
    case 'book': e.stopPropagation(); S.cardForm = null; S.draft = {pid:id, svc:0, day:0, time:null, addr:'Hanstavägen 82, Kista', card:0, terms:false}; go('book'); break;
    case 'svc': S.draft.svc = +id; render(); break;
    case 'day': S.draft.day = +id; S.draft.time = null; render(); break;
    case 'time': S.draft.time = id; render(); break;
    case 'paycard': S.draft.card = +id; render(); break;
    case 'terms': {
      if (e.target.closest('u')) { go('terms'); break; }
      S.draft.terms = !S.draft.terms; render(); break;
    }
    case 'addcard': S.cardForm = {no:'', exp:'', err:null}; render(); requestAnimationFrame(()=>{ const n = document.getElementById('cno'); if (n){ n.focus(); n.scrollIntoView({block:'center'}); } }); break;
    case 'cardcancel': S.cardForm = null; render(); break;
    case 'cardsave': {
      const no = document.getElementById('cno').value, exp = document.getElementById('cexp').value, cvc = document.getElementById('ccvc').value;
      const err = validateCard(no, exp, cvc);
      if (err){ S.cardForm = {no, exp, err}; render(); return; }
      S.cards.push({last4: no.replace(/\D/g,'').slice(-4), exp});
      if (S.draft && cur.s === 'book') S.draft.card = S.cards.length - 1;
      S.cardForm = null; save(); render(); toast(t('cardAdded')); break;
    }
    case 'rmcard': S.cards.splice(+id, 1); save(); render(); toast(t('cardRemoved')); break;
    case 'confirm': {
      const d = S.draft, p = prov(d.pid), svc = services(p)[d.svc];
      if (!d.addr.trim()){ toast(t('fillAddr')); document.getElementById('addr').focus(); return; }
      const cd = S.cards[d.card] || S.cards[0];
      const b = {id:'b'+Date.now().toString(36), cat:p.cat, title:svc[0], who:p.name, date:iso(dayOffset(d.day)), time:d.time, price:svc[1]+29, status:'ok', card:cd.last4};
      S.bookings.unshift(b); save(); S.stack = [{s:S.tab}]; go('done', {bid:b.id}); break;
    }
    case 'tabto': tab(id); break;
    case 'seg': S.seg = id; render(); break;
    case 'cancel': {
      if (el.dataset.confirm !== 'y'){ el.dataset.confirm = 'y'; el.textContent = t('confirmCancel'); el.style.color = 'var(--danger)'; return; }
      S.bookings = S.bookings.filter(b=>b.id!==id); save(); render(); toast(t('cancelled')); break;
    }
    case 'rebook': { const b = S.bookings.find(x=>x.id===id); const p = PROV.find(x=>x.name===b.who); if (p) go('prov',{id:p.id}); break; }
    case 'chat': go('chat', {id}); break;
    case 'menu': { const [k,v] = id.split(':'); if (k==='tab') tab(v); else if (k==='go') go(v); else go('chat',{id:v}); break; }
    case 'toggle': S.set[id] = !S.set[id]; save(); render(); break;
    case 'updcheck': checkUpdate(false); break;
    case 'goupd': go('settings'); requestAnimationFrame(()=>{ const u = document.getElementById('updates'); if (u) u.scrollIntoView({block:'start'}); }); break;
    case 'lang': lang = id; save(); render(); break;
    case 'reset': {
      if (el.dataset.confirm !== 'y'){ el.dataset.confirm = 'y'; el.textContent = t('s_resetConfirm'); return; }
      store.clear(); store.set('lang', lang);
      S.bookings = seedBookings(); S.favs = ['p3']; S.cards = [{last4:'1234', exp:'08/28'}]; S.set = Object.assign({}, DEFAULT_SET); S.chats = {}; S.mapInfo = true;
      save(); render(); toast(t('s_resetDone')); break;
    }
  }
});

render();
if (S.set.autoUpd && Date.now() - S.upd.checked > 6 * 3600e3) setTimeout(() => checkUpdate(true), 1500);
</script>
